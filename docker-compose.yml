name: smarttraffic

# El mismo archivo corre en la laptop y en la máquina virtual.
# Límites: deploy.resources.limits (CPU y RAM por contenedor).
# La JVM usa MaxRAMPercentage para caber dentro de ese límite.

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    container_name: kafka
    ports:
      - "127.0.0.1:9094:9094"
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 18
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    container_name: rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: smarttraffic
      RABBITMQ_DEFAULT_PASS: smarttraffic
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  postgres:
    image: postgres:16-alpine
    hostname: postgres
    container_name: postgres
    environment:
      POSTGRES_DB: smarttraffic
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
    volumes:
      - smarttraffic_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d smarttraffic"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  traffic_sensor_simulator:
    build:
      context: .
      dockerfile: traffic-sensor-simulator/Dockerfile
    container_name: traffic_sensor_simulator
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  traffic_density_processor:
    build:
      context: .
      dockerfile: traffic-density-processor/Dockerfile
    container_name: traffic_density_processor
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  traffic_archiver:
    build:
      context: .
      dockerfile: traffic-archiver/Dockerfile
    container_name: traffic_archiver
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  user_dashboard_backend:
    build:
      context: .
      dockerfile: user-dashboard-backend/Dockerfile
    container_name: user_dashboard_backend
    depends_on:
      rabbitmq:
        condition: service_healthy
      traffic_density_processor:
        condition: service_started
    ports:
      - "80:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  alert_dispatcher:
    build:
      context: .
      dockerfile: alert-dispatcher/Dockerfile
    container_name: alert_dispatcher
    depends_on:
      rabbitmq:
        condition: service_healthy
      traffic_density_processor:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  query_client:
    build:
      context: .
      dockerfile: query-client/Dockerfile
    container_name: query_client
    depends_on:
      rabbitmq:
        condition: service_healthy
      alert_dispatcher:
        condition: service_started
      traffic_density_processor:
        condition: service_started
    environment:
      TRAFFIC_CLIENT_ID: client_456
      TRAFFIC_QUERY_INITIAL_DELAY_MS: 30000
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 448M

  query_client_2:
    build:
      context: .
      dockerfile: query-client/Dockerfile
    container_name: query_client_2
    depends_on:
      rabbitmq:
        condition: service_healthy
      alert_dispatcher:
        condition: service_started
      traffic_density_processor:
        condition: service_started
    environment:
      TRAFFIC_CLIENT_ID: client_789
      TRAFFIC_QUERY_INITIAL_DELAY_MS: 36000
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 448M

volumes:
  smarttraffic_pg:
